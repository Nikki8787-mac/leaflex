name: Deploy LeafLex
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_EVENT: ${{ github.event.release.tag_name }}
        run: |
          TAG="$TAG_EVENT"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo Nikki8787-mac/leaflex --json tagName --jq .tagName)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "部署 release: $TAG"
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo Nikki8787-mac/leaflex --pattern '*.zip'
          N=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$N" -ne 1 ]; then
            echo "::error::该 release 应有且只有 1 个 zip 资产，实际 $N 个"; exit 1
          fi
      - name: Unzip
        run: |
          mkdir site
          unzip -q *.zip -d site
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
